services:
  - type: web
    name: chamath-portfolio-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false          # set in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render generates this automatically
      - key: ADMIN_PASSWORD
        sync: false          # set in Render dashboard
      - key: FRONTEND_URL
        value: https://chamathwijerathne.github.io
      - key: NODE_ENV
        value: production
    autoDeploy: true
    healthCheckPath: /api/health
